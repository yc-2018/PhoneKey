name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build credential provider (MSVC)
        shell: cmd
        run: credential_provider\build_msvc.bat

      - name: Test credential provider
        shell: cmd
        run: credential_provider\test_msvc.bat

      - name: Run control logic tests
        run: python tools\test_control_logic.py

      - name: Stage credential provider DLL
        run: Copy-Item credential_provider\build\UnlockProvider.dll installer\UnlockProvider.dll -Force

      - name: Build PhoneKey.exe
        run: python -m PyInstaller --noconfirm PhoneKey.spec

      - name: Create checksums
        run: |
          $files = @('dist\PhoneKey.exe', 'installer\UnlockProvider.dll')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines -join "`n" | Set-Content -Encoding ascii -NoNewline SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\PhoneKey.exe `
            installer\UnlockProvider.dll `
            SHA256SUMS.txt `
            --title "PhoneKey $env:GITHUB_REF_NAME" `
            --generate-notes
