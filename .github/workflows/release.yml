name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build app and NSIS installer
        run: npm run tauri build

      - name: Package portable build
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

          $target = if (Test-Path "target/release/phonekey.exe") {
            "target/release"
          } elseif (Test-Path "src-tauri/target/release/phonekey.exe") {
            "src-tauri/target/release"
          } else {
            throw "phonekey.exe not found"
          }

          $stage = Join-Path $env:RUNNER_TEMP "PhoneKey"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "installer") | Out-Null
          Copy-Item (Join-Path $target "phonekey.exe") (Join-Path $stage "phonekey.exe")
          Copy-Item "installer/install_cp.ps1" (Join-Path $stage "installer")
          Copy-Item "installer/uninstall_cp.ps1" (Join-Path $stage "installer")
          Copy-Item "installer/UnlockProvider.dll" (Join-Path $stage "installer")
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE")
          Compress-Archive -Path $stage -DestinationPath "PhoneKey-$version-portable.zip" -Force

          $installer = Get-ChildItem (Join-Path $target "bundle/nsis/*.exe") |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under $target/bundle/nsis"
          }
          Copy-Item $installer.FullName "PhoneKey-$version-setup.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKey-${{ steps.package.outputs.version }}
          path: |
            PhoneKey-${{ steps.package.outputs.version }}-portable.zip
            PhoneKey-${{ steps.package.outputs.version }}-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PhoneKey ${{ github.ref_name }}
          body: |
            PhoneKey ${{ steps.package.outputs.version }}

            - 修复开启「离开后自动锁屏」后，手机持续不在附近时手动登录仍会被反复锁屏的问题；现在只在「在附近 → 离开」时触发一次。
            - 修复部分设备顶部状态显示「未命名设备」的问题，设备名称现在与列表、重命名弹窗一致。
            - 安装版：运行 `PhoneKey-${{ steps.package.outputs.version }}-setup.exe`。
            - 绿色版：解压 `PhoneKey-${{ steps.package.outputs.version }}-portable.zip`，运行 `PhoneKey\phonekey.exe`。
            - 首次使用请在「解锁」页安装凭证组件（需要管理员权限），保存 Windows 密码并添加解锁设备。
            - 手机蓝牙广播目前仅支持小米；其他品牌可添加 Wi-Fi 辅助，但 Wi-Fi 辅助只按 IP / 主机名判断，不校验 MAC，只能确认同网在线，不能判断距离。
            - 关闭主窗口会销毁界面并释放 WebView2 内存；未锁屏且未开启「离开自动锁屏」时暂停 BLE 与 Wi-Fi 探测，锁屏或重新打开窗口后恢复。
            - 系统要求：Windows 11 x64，小米手机开启系统 BLE 广播，或使用 Wi-Fi 辅助。
            - 锁屏组件依赖 Microsoft Visual C++ 2015–2022 x64 运行库；缺失时安装包会提示，请先补装再安装组件。
          files: |
            PhoneKey-${{ steps.package.outputs.version }}-portable.zip
            PhoneKey-${{ steps.package.outputs.version }}-setup.exe
