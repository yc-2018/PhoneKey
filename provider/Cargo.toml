[package]
name = "unlock_provider"
version = "0.2.0"
edition = "2021"
description = "PhoneKey credential provider for Windows 11"

[lib]
name = "unlock_provider"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
